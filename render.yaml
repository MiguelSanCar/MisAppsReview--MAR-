# Blueprint de Render (https://render.com). Un disco persistente exige un plan de pago (starter).
services:
  - type: web
    name: mar
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: mar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL        # p. ej. https://mar.onrender.com
        sync: false
      - key: CLIENT_ORIGIN     # el mismo valor que PUBLIC_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
